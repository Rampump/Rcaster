[workspace]
members = [
    "crates/rcaster-app",
    "crates/rcaster-core",
    "crates/rcaster-rtklib",
    "crates/rcaster-service",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
argon2 = "0.5.3"
asn1-rs = "0.6.2"
brotli = "9.1.3"
ed25519-dalek = "2.2.0"
etcd-client = { version = "0.21.1", features = ["raw-channel", "tls-ring"] }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
libc = "0.2"
prost = "0.14.6"
rand = "0.9"
redb = "2.6.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.7"
sha2 = "0.10.9"
der = "0.8"
x509-cert = "0.3.1"
x509-ocsp = "0.3.0-rc.1"
subtle = "2.6"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-tungstenite = "0.28"
tonic = { version = "0.14.5", features = ["tls-ring"] }
tonic-prost = "0.14.5"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
x509-parser = { version = "0.16.0", features = ["verify"] }
