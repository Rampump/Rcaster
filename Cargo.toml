[workspace]
members = ["crates/rcaster-core", "crates/rcaster-rtklib", "crates/rcaster-service"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
etcd-client = "0.21.1"
prost = "0.14.6"
rand = "0.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14.5", features = ["tls-ring"] }
tonic-prost = "0.14.5"
