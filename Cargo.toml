[workspace]
members = ["crates/rcaster-core", "crates/rcaster-service"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
etcd-client = "0.21.1"
prost = "0.14.6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14.5", features = ["tls-ring"] }
tonic-prost = "0.14.5"
