[workspace]
members = ["crates/rcaster-core", "crates/rcaster-service"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
etcd-client = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
