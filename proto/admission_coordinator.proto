syntax = "proto3";

package rcaster.admission.v1;

service AdmissionService {
  rpc AdmitClient(AdmitClientRequest) returns (AdmitClientResponse);
  rpc AdmitSource(AdmitSourceRequest) returns (AdmitSourceResponse);
}

service RelayService {
  rpc Open(RelayOpenRequest) returns (stream RelayChunk);
  rpc Health(RelayHealthRequest) returns (RelayHealthResponse);
}

message RelayOpenRequest {
  string cluster_id = 1;
  string mountpoint = 2;
  uint64 source_generation = 3;
  string connection_id = 4;
  string requesting_caster_id = 5;
}

message RelayChunk {
  bytes data = 1;
}

message RelayHealthRequest {
  string cluster_id = 1;
  string mountpoint = 2;
  uint64 source_generation = 3;
  string connection_id = 4;
}

message RelayHealthResponse {
  bytes payload = 1;
}

message AdmitClientRequest {
  int64 caster_lease_id = 1;
  string session_id = 2;
  string user_id = 3;
  string mountpoint = 4;
  string caster_id = 5;
  string runtime_epoch = 6;
  string client_ip = 7;
  uint64 max_sessions = 8;
  optional uint64 ip_max_sessions = 9;
  string started_at = 10;
  uint64 config_generation = 11;
  int64 config_revision = 12;
  string ntrip_version = 13;
  optional string software = 14;
  uint64 user_mod_revision = 15;
  uint64 mountpoint_mod_revision = 16;
}

message AdmitClientResponse {
  oneof result {
    AdmitClientSuccess success = 1;
    AdmissionError error = 2;
  }
}

message AdmitClientSuccess {}

message AdmissionError {
  string code = 1;
  string message = 2;
}

message AdmitSourceRequest {
  int64 caster_lease_id = 1;
  string session_id = 2;
  string user_id = 3;
  string mountpoint = 4;
  string caster_id = 5;
  string runtime_epoch = 6;
  uint64 max_sessions = 7;
  string started_at = 8;
  string connection_id = 9;
  string relay_endpoint = 10;
  uint64 config_generation = 11;
  int64 config_revision = 12;
  string ntrip_version = 13;
  optional string software = 14;
  uint64 user_mod_revision = 15;
  uint64 mountpoint_mod_revision = 16;
}

message AdmitSourceResponse {
  oneof result {
    AdmitSourceSuccess success = 1;
    AdmissionError error = 2;
  }
}

message AdmitSourceSuccess {
  uint64 source_generation = 1;
}
